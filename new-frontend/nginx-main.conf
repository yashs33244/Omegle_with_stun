# Main config of the frontend image (nginxinc/nginx-unprivileged), copied to
# /etc/nginx/nginx.conf by the Dockerfile. The site config is nginx.conf in
# this directory, rendered by the image entrypoint into conf.d/default.conf.
# Limits match the gateway (deploy/nginx/nginx.conf); the container's nofile
# ulimit is set in docker-compose.yml.

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Includes application/wasm for .wasm (needed for streaming compilation).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    keepalive_timeout 65s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    # Slow clients (slowloris): request line and headers, or a body, that do
    # not arrive within 10 s are dropped instead of holding a connection for
    # the default 60 s; send_timeout is between two writes of a response, so
    # the 4 MB model wasm is never cut for a client that keeps reading. Same
    # values as the gateway (deploy/nginx/nginx.conf).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;

    include /etc/nginx/conf.d/*.conf;
}
