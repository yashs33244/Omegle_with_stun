# Template rendered by the nginx image entrypoint (envsubst) into
# /etc/nginx/conf.d/default.conf. Only variables that exist in the container
# environment (CSP_CONNECT_SRC) are substituted; nginx $variables are kept.
# Worker limits are in nginx-main.conf.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm application/manifest+json;

    # Security headers for every response. nginx drops inherited add_header
    # directives in a location that sets its own, so those locations include
    # this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    # Liveness for the container healthcheck and the deploy verification.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The SPA shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed file names under /assets/. No `always`: a 404
    # for an asset must not be cached for a year by browsers or a CDN.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted on-device moderation models and their wasm runtimes
    # (public/models/). Cached for a year: a new model version must use a new
    # path (for example /models/nsfwjs/v2/...), never overwrite a file. A
    # missing file is a 404, never the SPA shell, so a typo cannot be cached
    # as a model. .wasm is served as application/wasm (mime.types), which
    # streaming compilation needs. The image ships a .gz next to each file
    # (Dockerfile); gzip_static sends it to clients that accept gzip, with the
    # original file's type, and Vary: Accept-Encoding (gzip_vary).
    location /models/ {
        gzip_static on;
        include /etc/nginx/conf.d/security-headers.inc;
        # Not "always": a 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Admin console: a lazy chunk of the same SPA. Its API stays on the API
    # origin (/admin/api/ on the gateway). Not for search engines.
    location ^~ /admin {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # Client-side routing: unknown paths serve the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
