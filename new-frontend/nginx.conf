# Template rendered by the nginx image entrypoint (envsubst) into
# /etc/nginx/conf.d/default.conf. Only variables that exist in the container
# environment (CSP_CONNECT_SRC) are substituted; nginx $variables are kept.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers for every response. nginx drops inherited add_header
    # directives in a location that sets its own, so those locations include
    # this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    # Liveness for the container healthcheck and the deploy verification.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The SPA shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed file names under /assets/.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths serve the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
