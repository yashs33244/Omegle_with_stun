# Template rendered by the nginx image entrypoint (envsubst) into
# /etc/nginx/conf.d/default.conf. Only variables that exist in the container
# environment (CSP_CONNECT_SRC) are substituted; nginx $variables are kept.
# Worker limits and slow-client timeouts are in nginx-main.conf.

# Per-client connection limit, keyed like the gateway's (deploy/nginx/gateway.conf):
# the address the host proxy saw (X-Forwarded-For believed only from private
# hops), then CF-Connecting-IP when that address is a Cloudflare edge. The
# Cloudflare ranges come from /etc/nginx/chizzy/cloudflare-ips.conf:
# docker-compose.yml mounts deploy/nginx there; the image alone ships an empty
# list (nginx-cloudflare-ips.conf), so CF-Connecting-IP is never believed and
# every edge address counts as one client. Health checks from inside the
# container and the compose network ($chizzy_peer = local) are not counted.
geo $chizzy_peer {
    default public;
    include /etc/nginx/chizzy/cloudflare-ips.conf;
    127.0.0.0/8 local;
    10.0.0.0/8 local;
    172.16.0.0/12 local;
    192.168.0.0/16 local;
    ::1/128 local;
    fc00::/7 local;
}
map "$chizzy_peer:$http_cf_connecting_ip" $chizzy_client_ip {
    "~^cloudflare:(?<cf_ip>[0-9A-Fa-f:.]+)$" $cf_ip;
    default $remote_addr;
}
map $chizzy_peer $chizzy_limit_key {
    local   "";
    default $chizzy_client_subscriber;
}
# One key per subscriber, as the backend counts (backend/src/session/geo.ts
# ipBuckets): an IPv4 address as is, an IPv6 address as its /64 written as
# four groups, so rotating addresses inside one /64 shares one budget.
# $remote_addr and CF-Connecting-IP are in RFC 5952 form (lowercase, no
# leading zeros, the longest zero run as "::", never a single 0 group); each
# pattern is one place the "::" can sit relative to the first four groups.
map $chizzy_client_ip $chizzy_client_subscriber {
    "~^::ffff:(?<v4>[0-9.]+)$"                                                       $v4;
    "~*^(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"             "$g::/64";
    "~*^(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                          "$g:0::/64";
    "~*^(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                                        "$g:0:0::/64";
    "~*^(?<g>[0-9a-f]{1,4})::(?<t>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"               "$g:0:0:$t::/64";
    "~*^(?<g>[0-9a-f]{1,4})::"                                                      "$g:0:0:0::/64";
    "~*^::(?<t>[0-9a-f]{1,4}):(?<u>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"              "0:0:$t:$u::/64";
    "~*^::(?<t>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                                  "0:0:0:$t::/64";
    "~^::"                                                                          "0:0:0:0::/64";
    default                                                                         $chizzy_client_ip;
}
# 10 MB holds about 160 000 addresses.
limit_conn_zone $chizzy_limit_key zone=chizzy_frontend_conn:10m;
limit_conn_status 429;
limit_conn_log_level warn;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from fc00::/7;
    set_real_ip_from ::1/128;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # A page load opens a handful of connections (shell, assets, the
    # moderation models in parallel); 32 leaves room for that and for a few
    # tabs, and stops one address from holding the worker connections.
    limit_conn chizzy_frontend_conn 32;
    # A static site takes no request bodies: anything larger is 413 before it
    # is read. Each static location below also refuses every method but GET
    # and HEAD (limit_except GET allows both) with 403; /healthz is left open.
    client_max_body_size 1k;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm application/manifest+json;

    # Security headers for every response. nginx drops inherited add_header
    # directives in a location that sets its own, so those locations include
    # this file again.
    include /etc/nginx/conf.d/security-headers.inc;

    # Liveness for the container healthcheck and the deploy verification.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed file names under /assets/. No `always`: a 404
    # for an asset must not be cached for a year by browsers or a CDN.
    location /assets/ {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted on-device moderation models and their wasm runtimes
    # (public/models/). Cached for a year: a new model version must use a new
    # path (for example /models/nsfwjs/v2/...), never overwrite a file. A
    # missing file is a 404, never the SPA shell, so a typo cannot be cached
    # as a model. .wasm is served as application/wasm (mime.types), which
    # streaming compilation needs. The image ships a .gz next to each file
    # (Dockerfile); gzip_static sends it to clients that accept gzip, with the
    # original file's type, and Vary: Accept-Encoding (gzip_vary).
    location /models/ {
        limit_except GET { deny all; }
        gzip_static on;
        include /etc/nginx/conf.d/security-headers.inc;
        # Not "always": a 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Admin console: a lazy chunk of the same SPA. Its API stays on the API
    # origin (/admin/api/ on the gateway). Not for search engines.
    location ^~ /admin {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # nginx's mime.types has no entry for the web app manifest.
    location = /manifest.webmanifest {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        types {}
        default_type application/manifest+json;
    }

    # Client-side routing: a prerendered shell (/terms -> /terms/index.html,
    # written by scripts/prerender-meta.mjs, no redirect to /terms/) when there
    # is one, otherwise the SPA shell. Everything served from here (the shells,
    # robots.txt, sitemap.xml, icons) is revalidated on every request so new
    # deploys are picked up; only /assets/ and /models/ are cached for a year.
    location / {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }
}
