# Template rendered into /etc/nginx/conf.d/security-headers.inc and included by
# nginx.conf. ${CSP_CONNECT_SRC} is exported by nginx-api-origin.envsh ('self'
# plus the API origin over https and wss). e2e/vite.preview.config.ts parses
# this file, so keep each add_header on one line.
#
# Third parties allowed by the CSP, and why:
#   challenges.cloudflare.com   Turnstile widget (script, iframe, verification calls)
#   *.ingest(.us|.de).sentry.io Sentry error reports (DSN from /api/config;
#                               US and EU data regions)
#   us/eu.i.posthog.com         PostHog cookieless events (no session recording,
#                               no remote script loading: posthog-js must run with
#                               disable_external_dependency_loading). A custom
#                               POSTHOG_HOST (reverse proxy) must be added here.
#   checkout.razorpay.com       Razorpay Checkout (checkout.js, its iframe and calls)
#   api.razorpay.com            Razorpay payment iframe/API; lumberjack.razorpay.com
#                               is Checkout's own telemetry. Permissions-Policy lets
#                               those two origins use the Payment Request API (UPI
#                               intent / Google Pay inside the Checkout iframe).
# Moderation models and their wasm runtimes are self-hosted under /models/;
# 'wasm-unsafe-eval' lets them compile WebAssembly, workers may use blob: URLs.
# style-src keeps 'unsafe-inline' on purpose. `style-src 'self'; style-src-attr
# 'unsafe-inline'` was tried: it blocks <style> elements written at runtime, and
# the app needs two of them. Radix dialogs (react-remove-scroll) insert one for
# the scroll lock with a scrollbar width measured at runtime, and Razorpay's
# checkout.js writes one into its container (spinner, mobile frame layout). A
# static host cannot hand out a per-response nonce and computed CSS has no
# fixed hash; with it the e2e suite failed 32 of 39 tests on style-src-elem violations.
# No CSP report-uri/report-to: there is no reporting endpoint to send them to.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://checkout.razorpay.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src ${CSP_CONNECT_SRC} https://challenges.cloudflare.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io https://us.i.posthog.com https://eu.i.posthog.com https://api.razorpay.com https://checkout.razorpay.com https://lumberjack.razorpay.com; frame-src https://challenges.cloudflare.com https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(), geolocation=(), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\"), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS: a browser ignores it over plain http (docker compose, the e2e preview),
# so it only takes effect behind a TLS terminator, where it should.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
