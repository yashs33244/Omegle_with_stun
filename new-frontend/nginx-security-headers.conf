# Template rendered into /etc/nginx/conf.d/security-headers.inc and included by
# nginx.conf. ${CSP_CONNECT_SRC} is exported by nginx-api-origin.envsh ('self'
# plus the API origin over https and wss). e2e/vite.preview.config.ts parses
# this file, so keep each add_header on one line.
#
# Third parties allowed by the CSP, and why:
#   challenges.cloudflare.com   Turnstile widget (script, iframe, verification calls)
#   *.ingest(.us).sentry.io     Sentry error reports (DSN from /api/config)
#   us/eu.i.posthog.com         PostHog cookieless events (no session recording,
#                               no remote script loading: posthog-js must run with
#                               disable_external_dependency_loading)
# Moderation models and their wasm runtimes are self-hosted under /models/;
# 'wasm-unsafe-eval' lets them compile WebAssembly, workers may use blob: URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src ${CSP_CONNECT_SRC} https://challenges.cloudflare.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://us.i.posthog.com https://eu.i.posthog.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
