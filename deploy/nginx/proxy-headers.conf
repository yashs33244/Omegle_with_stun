# Request headers for every location that proxies to the backend (included
# by gateway.conf). The maps they use are defined there.
proxy_http_version 1.1;
proxy_set_header Host $host;
# The backend reads the client IP from X-Real-IP when TRUST_PROXY=true.
proxy_set_header X-Real-IP $chizzy_client_ip;
proxy_set_header X-Forwarded-For $chizzy_client_ip;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Only set for requests that came from Cloudflare (empty removes the header).
proxy_set_header CF-Connecting-IP $chizzy_cf_connecting_ip;
proxy_set_header CF-IPCountry $chizzy_cf_country;
