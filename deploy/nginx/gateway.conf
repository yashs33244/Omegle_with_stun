# Gateway in front of the backend replicas. Included inside the http {} block
# of nginx.conf (next to this file); the directory is mounted read-only at
# /etc/nginx/chizzy by docker-compose.yml.
#
# Load balancing: clients use the Socket.IO websocket transport only, so no
# sticky sessions are needed and least_conn spreads long-lived sockets evenly.
# (ip_hash would pin everyone to one replica: behind the EC2 host proxy all
# traffic arrives from the same address.)
#
# Routes (all to the same backend replicas; /socket.io/ through its own
# upstream, backend_ws):
#   /socket.io/   signaling websockets (long timeouts)
#   /api/         public REST: session gate, config, appeals, takedowns,
#                 restrictions (small JSON bodies only, 64 KB cap)
#   /admin/api/   admin REST (bearer token in the backend; put Cloudflare
#                 Access in front of it, DEPLOYMENT.md)
#   /healthz, /readyz, /health   backend liveness and readiness
#   anything else                404 at the gateway, never proxied
# Every route has a per-client rate and connection limit (the limit_req_zone
# section below); health checks from the host and the compose network are
# exempt.
# Report evidence travels inside the socket (report:submit), never as REST.

# Docker's embedded DNS. `resolve` below re-reads the replica list from it, so
# scaling the backend up or down is picked up without reloading nginx.
# Not much shorter: nginx cannot retry a request on another replica when the
# list changed while the request was connecting (it answers 504 instead), so
# frequent lookups turn more replica failures into client errors. Measured
# with a replica killed under load: valid=2s gave a 504 in 4 of 6 runs, 10s in
# none.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend_upstream 64k;
    least_conn;
    # One failed connect marks a replica down for fail_timeout. The default
    # 10 s kept the gateway answering 502 for about 10 s after a restart or
    # deploy had already brought the replicas back. With 2 s a dead replica
    # gets one probing connect every 2 s until DNS drops it.
    server backend:3004 resolve fail_timeout=2s;
    # Idle keepalive connections for REST requests. Upgraded websockets are
    # never returned to this pool.
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

# The same replicas for /socket.io/ only. A websocket handshake shed with 503
# is retried on another replica and counts as a failure (proxy_next_upstream
# http_503 below), marking that replica down for fail_timeout. Failure state
# is kept per upstream, so a full replica stops getting new handshakes while
# /api/, /admin/api/ and the health routes (upstream backend) keep reaching it.
upstream backend_ws {
    zone backend_ws_upstream 64k;
    least_conn;
    server backend:3004 resolve fail_timeout=2s;
}

# Address of whoever connected to the host proxy. The EC2 host proxy (and
# Docker's port publishing) connect from private addresses; trust
# X-Forwarded-For only from those, walking right to left past trusted hops. A
# client that reaches this port directly from the internet cannot spoof its
# address, because its own IP is not trusted. Behind Cloudflare this is a
# Cloudflare edge address; the real client is resolved below.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
set_real_ip_from ::1/128;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Where the request came from: cloudflare (a published Cloudflare range,
# refreshed by deploy/cloudflare-ips.sh), local (health checks on the host and
# the compose network) or public (anyone else).
geo $chizzy_peer {
    default public;
    include /etc/nginx/chizzy/cloudflare-ips.conf;
    127.0.0.0/8 local;
    10.0.0.0/8 local;
    172.16.0.0/12 local;
    192.168.0.0/16 local;
    ::1/128 local;
    fc00::/7 local;
}

# Cloudflare headers are believed only on requests that came from Cloudflare;
# from anywhere else they are dropped, so a client that reaches the origin
# directly cannot pick its own IP or country. An empty value removes the
# header from the proxied request.
map "$chizzy_peer:$http_cf_connecting_ip" $chizzy_client_ip {
    "~^cloudflare:(?<cf_ip>[0-9A-Fa-f:.]+)$" $cf_ip;
    default $remote_addr;
}
map $chizzy_peer $chizzy_cf_country {
    cloudflare $http_cf_ipcountry;
    default "";
}
map $chizzy_peer $chizzy_cf_connecting_ip {
    cloudflare $chizzy_client_ip;
    default "";
}

# WebSocket upgrade. An empty Connection header (instead of "close") keeps
# upstream keepalive working for plain HTTP requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Keep the scheme the host proxy saw (TLS terminates there).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate and connection limits, keyed by the client address the backend sees.
# Health checks and the compose/CI network ($chizzy_peer = local) are exempt
# (an empty key is not counted). Every limit is well above what one real
# client does and above the backend's own per-IP limits (config.ts), so the
# backend still decides for normal traffic; the gateway only stops floods
# before they cost the replicas CPU and memory. A limited request gets 429,
# the status the backend uses for its own limits, so clients back off the
# same way. Sizes: 10 MB holds about 160 000 addresses per zone.
map $chizzy_peer $chizzy_limit_key {
    local   "";
    default $chizzy_client_subscriber;
}
# One key per subscriber, as the backend counts (backend/src/session/geo.ts
# ipBuckets): an IPv4 address as is, an IPv6 address as its /64 written as
# four groups, so rotating addresses inside one /64 shares one budget.
# $remote_addr and CF-Connecting-IP are in RFC 5952 form (lowercase, no
# leading zeros, the longest zero run as "::", never a single 0 group); each
# pattern is one place the "::" can sit relative to the first four groups.
map $chizzy_client_ip $chizzy_client_subscriber {
    "~^::ffff:(?<v4>[0-9.]+)$"                                                       $v4;
    "~*^(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):"             "$g::/64";
    "~*^(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                          "$g:0::/64";
    "~*^(?<g>[0-9a-f]{1,4}:[0-9a-f]{1,4})::"                                        "$g:0:0::/64";
    "~*^(?<g>[0-9a-f]{1,4})::(?<t>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"               "$g:0:0:$t::/64";
    "~*^(?<g>[0-9a-f]{1,4})::"                                                      "$g:0:0:0::/64";
    "~*^::(?<t>[0-9a-f]{1,4}):(?<u>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"              "0:0:$t:$u::/64";
    "~*^::(?<t>[0-9a-f]{1,4})(:[0-9a-f]{1,4}){4}$"                                  "0:0:0:$t::/64";
    "~^::"                                                                          "0:0:0:0::/64";
    default                                                                         $chizzy_client_ip;
}
# Socket.IO handshakes (new sockets): the backend allows a burst of 20, then
# 1/s per IP and replica (CONNECT_BURST_PER_IP, CONNECT_RATE_PER_IP_PER_SEC).
limit_req_zone $chizzy_limit_key zone=chizzy_socket:10m rate=5r/s;
# POST /api/session: the backend allows 10/min per IP and 60/min per /24.
limit_req_zone $chizzy_limit_key zone=chizzy_session:10m rate=1r/s;
# Other public REST (config, appeals, takedowns, billing) and health checks.
limit_req_zone $chizzy_limit_key zone=chizzy_api:10m rate=20r/s;
# Admin REST: a console does a few requests per second at most; this also
# caps bearer token guessing (the backend limits failed attempts too).
limit_req_zone $chizzy_limit_key zone=chizzy_admin:10m rate=5r/s;
# Open connections per client address (websockets and in-flight requests).
limit_conn_zone $chizzy_limit_key zone=chizzy_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Off by default; deploy/cloudflare-ips.sh writes a rule here when
    # CLOUDFLARE_ONLY=true (refuse public addresses that are not Cloudflare).
    include /etc/nginx/chizzy/cloudflare-only.conf;

    # REST bodies are small JSON (the takedown form is the largest, ~3 KB).
    # Buffer them in memory instead of temp files.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    # Gateway liveness (does not touch the backend). Used by the container
    # healthcheck so a backend outage does not restart the gateway.
    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metrics are per replica; a load-balanced scrape would be meaningless and
    # would leak counters publicly. Scrape replicas on the compose network.
    location = /metrics {
        return 404;
    }

    location /socket.io/ {
        # Socket.IO caps messages at 256 KB; this only matters for long-polling
        # POSTs from local tools, websocket frames are not affected.
        client_max_body_size 1m;
        # Handshakes per IP, and sockets per IP (the backend allows
        # MAX_CONNECTIONS_PER_IP, default 10, per replica).
        limit_req zone=chizzy_socket burst=20 nodelay;
        limit_conn chizzy_conn 32;

        proxy_pass http://backend_ws;
        include /etc/nginx/chizzy/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Websockets are long lived; Socket.IO pings every 20 s in both
        # directions, so a tunnel with 5 minutes of silence is dead on one
        # side and only holds two file descriptors.
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        proxy_buffering off;
        # TCP keepalive towards the replica, so a vanished replica is noticed
        # on idle sockets too.
        proxy_socket_keepalive on;

        # Retry another replica when the connection failed, or when a replica
        # shed the handshake with 503 (at its socket cap, past its session
        # bucket, or overloaded: backend/src/shed/Shedder.ts refuseUpgrade).
        # A refused upgrade GET has done no work on the replica, so the retry
        # is safe; two tries in all, so a full cluster still answers 503
        # quickly instead of walking every replica. A 503 counts as a failed
        # attempt, so a full replica also gets no new handshakes for
        # fail_timeout (2 s); with every replica full the gateway can answer
        # 502 ("no live upstreams") for that long, which clients retry like
        # the 503. Only upstream backend_ws is affected; REST routes use
        # upstream backend and still reach the replica.
        proxy_next_upstream error timeout http_503;
        proxy_next_upstream_tries 2;
        # A killed or crashed replica keeps its address here until the next
        # DNS lookup (up to 10 s), and least_conn prefers it because it has no
        # connections, so clients reconnecting from it try it first. Its
        # address does not refuse, it times out. Replicas share the Docker
        # network (connects take well under 1 ms), so give up after 1 s and
        # retry another replica.
        proxy_connect_timeout 1s;
    }

    location /api/ {
        limit_req zone=chizzy_api burst=40 nodelay;
        limit_conn chizzy_conn 32;
        proxy_pass http://backend;
        include /etc/nginx/chizzy/proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 1s;
        # POST is never retried on another replica (nginx default for
        # non-idempotent methods), so a session is not created twice.
        proxy_next_upstream error timeout;

        # The session gate verifies a Turnstile token with Cloudflare and
        # signs a token on every call: the most expensive public request, so
        # it has the tightest limit. Inherits everything above except the
        # rate (limit_req is replaced, not merged, in a nested location).
        location = /api/session {
            limit_req zone=chizzy_session burst=20 nodelay;
            proxy_pass http://backend;
        }
    }

    location /admin/api/ {
        limit_req zone=chizzy_admin burst=10 nodelay;
        limit_conn chizzy_conn 16;
        proxy_pass http://backend;
        include /etc/nginx/chizzy/proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        # Admin responses (reports, evidence) must not be cached anywhere.
        add_header Cache-Control "no-store" always;
    }

    # Backend liveness and readiness (deploy.sh and CI verify through here).
    location ~ ^/(healthz|readyz|health)$ {
        limit_req zone=chizzy_api burst=40 nodelay;
        limit_conn chizzy_conn 32;
        proxy_pass http://backend;
        include /etc/nginx/chizzy/proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
    }

    # The backend serves nothing else; unknown paths never reach a replica.
    location / {
        return 404;
    }
}
