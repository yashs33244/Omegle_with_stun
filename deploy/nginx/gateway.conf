# Gateway in front of the backend replicas. Mounted by docker-compose.yml as
# /etc/nginx/conf.d/default.conf in the nginx-unprivileged image, so everything
# here lives inside the image's http {} block.
#
# Load balancing: clients use the Socket.IO websocket transport only, so no
# sticky sessions are needed and least_conn spreads long-lived sockets evenly.
# (ip_hash would pin everyone to one replica: behind the EC2 host proxy all
# traffic arrives from the same address.)

# Docker's embedded DNS. `resolve` below re-reads the replica list from it, so
# scaling the backend up or down is picked up without reloading nginx.
# Not much shorter: nginx cannot retry a request on another replica when the
# list changed while the request was connecting (it answers 504 instead), so
# frequent lookups turn more replica failures into client errors. Measured
# with a replica killed under load: valid=2s gave a 504 in 4 of 6 runs, 10s in
# none.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend_upstream 64k;
    least_conn;
    # One failed connect marks a replica down for fail_timeout. The default
    # 10 s kept the gateway answering 502 for about 10 s after a restart or
    # deploy had already brought the replicas back. With 2 s a dead replica
    # gets one probing connect every 2 s until DNS drops it.
    server backend:3004 resolve fail_timeout=2s;
    keepalive 32;
}

# Real client IP. Production traffic goes client -> Cloudflare -> EC2 host
# proxy -> gateway. Walking X-Forwarded-For right to left, nginx skips every
# trusted hop and takes the first untrusted address as the client:
#   - the host proxy (and Docker's port publishing) connect from private
#     addresses;
#   - the hop before that is a Cloudflare edge address, which many unrelated
#     users share, so the Cloudflare ranges are trusted too. Without them the
#     backend's per-IP connection cap would count everyone on one edge address
#     as a single client.
# A client that reaches the origin directly cannot spoof its address: the host
# proxy appends the client's own (untrusted) IP, so the walk stops there.
# This needs a host proxy that appends to the X-Forwarded-For it received
# (see DEPLOYMENT.md).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
set_real_ip_from ::1/128;
# Cloudflare ranges from https://www.cloudflare.com/ips/ (checked 2026-10-04).
# Cloudflare changes them rarely; refresh this list now and then.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# WebSocket upgrade. An empty Connection header (instead of "close") keeps
# upstream keepalive working for plain HTTP requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Keep the scheme the host proxy saw (TLS terminates there).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Socket.IO caps messages at 256 KB; this only matters for long-polling
    # POSTs from local tools, websocket frames are not affected.
    client_max_body_size 1m;

    # Gateway liveness (does not touch the backend). Used by the container
    # healthcheck so a backend outage does not restart the gateway.
    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metrics are per replica; a load-balanced scrape would be meaningless and
    # would leak counters publicly. Scrape replicas on the compose network.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The backend reads the client IP from X-Real-IP when TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Websockets are long lived; Socket.IO pings every ~25 s, so these only
        # need to exceed the ping interval comfortably.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;

        # Retry another replica only when the connection itself failed.
        proxy_next_upstream error timeout;
        # A killed or crashed replica keeps its address here until the next
        # DNS lookup (up to 10 s), and least_conn prefers it because it has no
        # connections, so clients reconnecting from it try it first. Its
        # address does not refuse, it times out. Replicas share the Docker
        # network (connects take well under 1 ms), so give up after 1 s and
        # retry another replica.
        proxy_connect_timeout 1s;
    }
}
