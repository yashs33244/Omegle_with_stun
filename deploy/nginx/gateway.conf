# Gateway in front of the backend replicas. Mounted by docker-compose.yml as
# /etc/nginx/conf.d/default.conf in the nginx-unprivileged image, so everything
# here lives inside the image's http {} block.
#
# Load balancing: clients use the Socket.IO websocket transport only, so no
# sticky sessions are needed and least_conn spreads long-lived sockets evenly.
# (ip_hash would pin everyone to one replica: behind the EC2 host proxy all
# traffic arrives from the same address.)

# Docker's embedded DNS. `resolve` below re-reads the replica list from it, so
# scaling the backend up or down is picked up without reloading nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend {
    zone backend_upstream 64k;
    least_conn;
    server backend:3004 resolve;
    keepalive 32;
}

# Real client IP. The EC2 host proxy (and Docker's port publishing) connect from
# private addresses; trust X-Forwarded-For only from those, walking right to
# left past trusted hops. A client that reaches this port directly from the
# internet cannot spoof its address, because its own IP is not trusted.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
set_real_ip_from ::1/128;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# WebSocket upgrade. An empty Connection header (instead of "close") keeps
# upstream keepalive working for plain HTTP requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Keep the scheme the host proxy saw (TLS terminates there).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Socket.IO caps messages at 256 KB; this only matters for long-polling
    # POSTs from local tools, websocket frames are not affected.
    client_max_body_size 1m;

    # Gateway liveness (does not touch the backend). Used by the container
    # healthcheck so a backend outage does not restart the gateway.
    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metrics are per replica; a load-balanced scrape would be meaningless and
    # would leak counters publicly. Scrape replicas on the compose network.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The backend reads the client IP from X-Real-IP when TRUST_PROXY=true.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Websockets are long lived; Socket.IO pings every ~25 s, so these only
        # need to exceed the ping interval comfortably.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;

        # Retry another replica only when the connection itself failed.
        proxy_next_upstream error timeout;
        proxy_connect_timeout 5s;
    }
}
