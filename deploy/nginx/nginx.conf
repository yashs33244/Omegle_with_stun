# Main config of the gateway container (nginxinc/nginx-unprivileged), mounted
# by docker-compose.yml as /etc/nginx/nginx.conf. The site config lives in
# gateway.conf next to this file (the directory is mounted at /etc/nginx/chizzy).
#
# Capacity: every proxied websocket holds two connections (client and
# upstream), so 16384 connections per worker is about 8000 sockets per worker.
# The container's nofile ulimit (65535, docker-compose.yml) covers
# worker_rlimit_nofile.

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The client address the backend sees ($chizzy_client_ip, gateway.conf:
    # CF-Connecting-IP for requests that came through Cloudflare), then the
    # peer that connected ($remote_addr, a Cloudflare edge for those). The
    # access log is one of the CERT-In logs (docs/retention.md), so it records
    # the real client, not the edge.
    log_format main '$chizzy_client_ip via $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;

    # Client keepalive for plain HTTP requests. Upgraded websocket connections
    # are not affected; they live until proxy_read_timeout in gateway.conf.
    keepalive_timeout 65s;
    keepalive_requests 1000;
    # Free the memory of clients that stopped reading.
    reset_timedout_connection on;

    include /etc/nginx/chizzy/gateway.conf;
}
