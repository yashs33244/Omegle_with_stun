# Chizzy production stack (also works locally: `docker compose up --build`).
#
#   browser --> frontend (static SPA, host :5173)
#   browser --> gateway (nginx, host :3004) --least_conn--> backend x N --> redis
#
# Every variable is documented in .env.example. The deploy workflow copies this
# file and deploy/ to the host and writes .env next to it.
#
# No top-level `name:`: the project name stays the directory name, which keeps
# the services of the previous compose file (backend, frontend) in the same
# project so the first deploy replaces them instead of clashing on ports.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4.11-alpine
    # Append-only persistence on a named volume. REDIS_PASSWORD is optional
    # (Redis is only reachable on the internal compose network).
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-chizzy-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    # No host port: only the gateway talks to the replicas.
    expose:
      - "3004"
    environment:
      NODE_ENV: production
      PORT: "3004"
      # Must be URL safe if set (for example `openssl rand -hex 32`).
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Always behind the gateway, which sets X-Real-IP to the client address.
      TRUST_PROXY: "true"
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-10}
      MATCH_ACCEPT_TIMEOUT_MS: ${MATCH_ACCEPT_TIMEOUT_MS:-5000}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-43200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3004/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Longer than SHUTDOWN_GRACE_MS so graceful shutdown can finish.
    stop_grace_period: 15s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  gateway:
    image: nginxinc/nginx-unprivileged:1.28.2-alpine3.23
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    # deploy/deploy.sh sets this to a checksum of gateway.conf, so a changed
    # config recreates the container (a file bind mount does not see the new
    # file once it is replaced on disk).
    labels:
      chizzy.gateway-conf-version: ${GATEWAY_CONF_VERSION:-local}
    # Set BIND_ADDRESS=127.0.0.1 when a host proxy (TLS) is in front, so the
    # stack cannot be reached around it.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-3004}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-chizzy-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./new-frontend
      args:
        # Socket server URL baked into the bundle (the gateway's public URL).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3004}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"
    restart: unless-stopped
    logging: *logging

  # Optional TURN relay for users behind symmetric NAT or strict firewalls.
  # Start with: docker compose --profile turn up -d
  # Host networking because TURN needs a wide UDP relay port range. Open on the
  # host firewall / security group: 3478 tcp+udp and TURN_MIN_PORT-TURN_MAX_PORT udp.
  coturn:
    image: coturn/coturn:4.7.0-alpine
    profiles: ["turn"]
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-chizzy}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
    entrypoint: ["sh", "-c"]
    # use-auth-secret: the backend issues short-lived HMAC credentials with the
    # same TURN_SECRET. Relaying to private, loopback and link-local addresses
    # (including the EC2 metadata endpoint) is denied so the relay cannot be
    # used to reach the host's internal network.
    command:
      - |
        if [ -z "$$TURN_SECRET" ]; then echo "coturn: TURN_SECRET is required" >&2; exit 1; fi
        exec turnserver -n --log-file=stdout --no-cli --fingerprint \
          --use-auth-secret --static-auth-secret="$$TURN_SECRET" --realm="$$TURN_REALM" \
          --listening-port=3478 --min-port="$$TURN_MIN_PORT" --max-port="$$TURN_MAX_PORT" \
          $${TURN_EXTERNAL_IP:+--external-ip="$$TURN_EXTERNAL_IP"} \
          --no-multicast-peers --user-quota=12 --total-quota=1200 --stale-nonce=600 \
          --denied-peer-ip=0.0.0.0-0.255.255.255 \
          --denied-peer-ip=10.0.0.0-10.255.255.255 \
          --denied-peer-ip=100.64.0.0-100.127.255.255 \
          --denied-peer-ip=127.0.0.0-127.255.255.255 \
          --denied-peer-ip=169.254.0.0-169.254.255.255 \
          --denied-peer-ip=172.16.0.0-172.31.255.255 \
          --denied-peer-ip=192.0.0.0-192.0.0.255 \
          --denied-peer-ip=192.168.0.0-192.168.255.255 \
          --denied-peer-ip=198.18.0.0-198.19.255.255 \
          --denied-peer-ip=::1 \
          --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff \
          --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    restart: unless-stopped
    logging: *logging

volumes:
  # Holds Redis data (coins, friends, bans). Never prune volumes on the host.
  redis-data:
