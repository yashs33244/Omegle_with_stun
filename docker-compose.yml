# Chizzy production stack (also works locally: `docker compose up --build`).
#
#   browser --> Cloudflare --> host proxy (TLS) --> frontend (static SPA, host :5173)
#   browser --> Cloudflare --> host proxy (TLS) --> gateway (nginx, host :3004)
#                                   --least_conn--> backend x N --> redis
#
# TURN is a hosted provider (Cloudflare Realtime TURN, TURN_PROVIDER=cloudflare).
# Nothing relays media on this host.
#
# Every variable is documented in .env.example. The deploy workflow copies this
# file and deploy/ to the host and writes .env next to it.
#
# No top-level `name:`: the project name stays the directory name, which keeps
# the services of the previous compose file (backend, frontend) in the same
# project so the first deploy replaces them instead of clashing on ports.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4.11-alpine
    # The image only drops root itself when the command is redis-server; this
    # command goes through sh, so set the user here (it owns /data).
    user: redis
    # Append-only persistence on a named volume. REDIS_PASSWORD is optional
    # (Redis is only reachable on the internal compose network).
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-chizzy-backend}:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    # No host port: only the gateway talks to the replicas.
    expose:
      - "3004"
    environment:
      NODE_ENV: production
      PORT: "3004"
      # Must be URL safe if set (for example `openssl rand -hex 32`).
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Always behind the gateway, which sets X-Real-IP to the client address.
      TRUST_PROXY: "true"
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-10}
      MATCH_ACCEPT_TIMEOUT_MS: ${MATCH_ACCEPT_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      # Session gate. Every variable is listed in .env.example; an empty value
      # means "use the backend default" (backend/src/config.ts). In production
      # the backend refuses to start without SESSION_SECRET, and without
      # TURNSTILE_SECRET plus TURNSTILE_SITE_KEY unless TURNSTILE_DISABLED=true.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_DISABLED: ${TURNSTILE_DISABLED:-false}
      # Per client IP and per /24 (or /48) network limits on POST /api/session,
      # and hourly match caps per IP and per device.
      SESSION_RATE_PER_IP_PER_MIN: ${SESSION_RATE_PER_IP_PER_MIN:-}
      SESSION_RATE_PER_NETWORK_PER_MIN: ${SESSION_RATE_PER_NETWORK_PER_MIN:-}
      MATCH_CAP_PER_DEVICE_PER_HOUR: ${MATCH_CAP_PER_DEVICE_PER_HOUR:-}
      MATCH_CAP_PER_IP_PER_HOUR: ${MATCH_CAP_PER_IP_PER_HOUR:-}
      # true only when Cloudflare proxies the API hostname (CF-IPCountry is used
      # for the country blocklist). The gateway forwards CF-* headers only for
      # requests that really came from a Cloudflare address.
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-false}
      # ICE servers. TURN credentials are issued per matched call.
      TURN_PROVIDER: ${TURN_PROVIDER:-}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-}
      # TURN credential cache and hourly caps, and the daily egress thresholds
      # (GB) of the TURN spend poller.
      TURN_CACHE_SECONDS: ${TURN_CACHE_SECONDS:-}
      TURN_MAX_PER_DEVICE_HOUR: ${TURN_MAX_PER_DEVICE_HOUR:-}
      TURN_MAX_PER_IP_HOUR: ${TURN_MAX_PER_IP_HOUR:-}
      TURN_SPEND_DAILY_GB: ${TURN_SPEND_DAILY_GB:-}
      # Observability. Sentry DSNs and the PostHog key are public by design.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      # Admin API (/admin/api/*). The backend refuses to start in production
      # without ADMIN_TOKEN. PSEUDONYM_SALT keys the device pseudonyms admins
      # see; empty derives it from ADMIN_TOKEN (they change when it rotates).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-}
      PSEUDONYM_SALT: ${PSEUDONYM_SALT:-}
      # Evidence store. EVIDENCE_DIR is fixed to the evidence volume below;
      # set EVIDENCE_S3_BUCKET to use S3 instead (credentials come from the
      # EC2 instance role, never from this file).
      EVIDENCE_DIR: /data/evidence
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
      EVIDENCE_S3_REGION: ${EVIDENCE_S3_REGION:-}
      EVIDENCE_S3_KMS_KEY_ID: ${EVIDENCE_S3_KMS_KEY_ID:-}
    volumes:
      # Shared by every replica on this host. The image creates /data/evidence
      # owned by the node user, and a new named volume copies that ownership.
      - evidence-data:/data/evidence
    # Each websocket is one file descriptor; the default limit can be 1024.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Longer than SHUTDOWN_GRACE_MS so graceful shutdown can finish.
    stop_grace_period: 15s
    # tini as PID 1 forwards SIGTERM to node and reaps zombies.
    init: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  gateway:
    image: nginxinc/nginx-unprivileged:1.28.2-alpine3.23
    volumes:
      # nginx.conf (worker limits) includes /etc/nginx/chizzy/gateway.conf.
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx:/etc/nginx/chizzy:ro
    # deploy/deploy.sh sets this to a checksum of deploy/nginx/, so a changed
    # config recreates the container (a bind mount does not see new files once
    # the directory is replaced on disk).
    labels:
      chizzy.gateway-conf-version: ${GATEWAY_CONF_VERSION:-local}
    # Each proxied websocket uses two file descriptors (client and upstream).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Set BIND_ADDRESS=127.0.0.1 when a host proxy (TLS) is in front, so the
    # stack cannot be reached around it.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-3004}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/gateway-healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-chizzy-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./new-frontend
      args:
        # Socket server URL baked into the bundle (the gateway's public URL).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3004}
        # Public URL of the site, for the canonical/link preview URLs and the sitemap.
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:5173}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    logging: *logging

volumes:
  # Holds Redis data (coins, friends, flags, sessions, reports). Never prune
  # volumes on the host.
  redis-data:
  # Report evidence (frames and chat lines) when EVIDENCE_S3_BUCKET is unset.
  # Retention is enforced by the backend (docs/retention.md). Never prune.
  evidence-data:
