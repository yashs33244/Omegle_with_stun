name: Release

# A SemVer tag vX.Y.Z (pushed by scripts/release.sh from new-v) runs the full
# CI, pushes the backend and frontend images to Docker Hub tagged X.Y.Z and
# latest, and publishes a GitHub Release whose body is the CHANGELOG.md
# section for that version plus the generated notes, with new-frontend/dist
# attached as a tarball. The image step is skipped when the DOCKERHUB_*
# secrets are absent (forks, or a Docker Hub-less setup). See CONTRIBUTING.md
# "Releases" and docs/runbooks/release.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BACKEND_IMAGE: yashs3324/omegle-backend
  FRONTEND_IMAGE: yashs3324/omegle-frontend
  # Same Node as ci.yml and new-frontend/Dockerfile (scripts/check-pins.sh).
  NODE_VERSION: "22.23.3"

jobs:
  preflight:
    name: Tag matches package.json and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      dockerhub: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $TAG is not vX.Y.Z" >&2; exit 1 ;;
          esac
          for f in backend/package.json new-frontend/package.json; do
            have=$(node -p "require('./$f').version")
            if [ "$have" != "$version" ]; then
              echo "$f has version $have, tag says $version (run scripts/release.sh)" >&2
              exit 1
            fi
          done
          grep -q "^## \[$version\] - " CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [$version] - <date>' section" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: dockerhub
        env:
          ENABLED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Push versioned images
    needs: [preflight, ci]
    if: needs.preflight.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.VERSION }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./new-frontend
          push: true
          # Same build args as deploy.yml; REACT_APP_API_URL is the older secret.
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || secrets.REACT_APP_API_URL || 'https://chizzyapi.itsyash.space' }}
            VITE_SITE_URL=${{ secrets.VITE_SITE_URL || 'https://chizzy.itsyash.space' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  release:
    name: GitHub Release
    needs: [preflight, ci, images]
    # images is skipped without Docker Hub secrets; the release still ships.
    if: always() && needs.ci.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      VITE_API_URL: ${{ vars.PAGES_API_URL || 'https://chizzy-api.onrender.com' }}
      VITE_SITE_URL: ${{ vars.PAGES_SITE_URL || 'https://chizzy.pages.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json
      - name: Build the frontend (static artifact, same inputs as pages.yml)
        working-directory: new-frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf "../chizzy-frontend-$VERSION.tar.gz" -C dist .
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\] - " { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md section for $VERSION is empty" >&2; exit 1
          fi
          printf '\nFull changelog: %s/blob/%s/CHANGELOG.md\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists; uploading the artifact only"
            gh release upload "$TAG" "chizzy-frontend-$VERSION.tar.gz" --clobber
          else
            gh release create "$TAG" "chizzy-frontend-$VERSION.tar.gz" \
              --verify-tag --title "v$VERSION" --notes-file release-notes.md --generate-notes
          fi
