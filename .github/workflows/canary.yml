name: Canary

# Synthetic check of the live session gate and matching: two headless socket
# clients (scripts/loadtest/canary.ts) must both reach call:start within 30 s.
#
# Opt-in: the job is skipped until the repository VARIABLE CANARY_URL is set
# (Settings -> Secrets and variables -> Actions -> Variables), for example the
# staging API origin. A failed run is the alert: GitHub emails the person who
# last changed this workflow's schedule, and Better Stack can watch the
# workflow status badge. Scheduled runs only happen on the default branch.
#
# Turnstile: the canary sends the secret CANARY_TURNSTILE_BYPASS as its token
# when the owner configures one; otherwise Cloudflare's dummy test token, which
# passes only where the backend does not verify tokens: TURNSTILE_DISABLED=true
# (production on Render today) or a Turnstile TEST secret (a staging stack).
# See docs/OPERATIONS.md, "Keep-alive and canary".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary:
    name: Two clients reach call:start
    if: vars.CANARY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
      # The canary has no dependencies of its own; it uses socket.io-client
      # from the backend's lockfile.
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Run the canary
        run: node scripts/loadtest/canary.ts
        env:
          CANARY_URL: ${{ vars.CANARY_URL }}
          CANARY_TURNSTILE_BYPASS: ${{ secrets.CANARY_TURNSTILE_BYPASS }}
