name: CI

on:
  pull_request:
  push:
    # new-v runs CI through deploy.yml (workflow_call) before deploying.
    branches-ignore: [new-v]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These, the redis service image and the nginx image below must match the
# Dockerfiles and docker-compose.yml (scripts/check-pins.sh checks it).
env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "22.23.3"

jobs:
  protocol:
    name: Protocol and lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/sync-protocol.sh --check
      - name: Lockfiles only reference the public npm registry
        run: sh scripts/check-lockfiles.sh
      - name: CI pins match the Dockerfiles and compose
        run: sh scripts/check-pins.sh
      - name: Deploy script tests
        run: bash scripts/test-deploy.sh
      - name: Every compose setting can be set through the deploy
        run: sh scripts/check-deploy-env.sh

  ops-lint:
    name: Workflows and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0
          deploy/deploy.sh deploy/cloudflare-ips.sh scripts/backup-redis.sh scripts/restore-redis.sh
          scripts/check-lockfiles.sh scripts/sync-protocol.sh new-frontend/nginx-api-origin.envsh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Node 22 is the production runtime; test:node runs the built server on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Typecheck the load test and canary (scripts/loadtest)
        run: node_modules/.bin/tsc -p ../scripts/loadtest
      - run: bun run lint
      - name: Test (includes the Redis suites)
        run: bun test
        env:
          REDIS_URL: redis://localhost:6379
      - name: Test every integration suite on the Redis store
        run: bun run test:redis
        env:
          REDIS_URL: redis://localhost:6379
      - run: bun run build
      - name: Test the built server under Node
        run: bun run test:node

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Inherited by the backends Playwright starts. Test-only values, not
    # secrets: the e2e browsers cannot solve a real Turnstile challenge.
    env:
      SESSION_SECRET: ci-e2e-session-secret-not-used-in-production
      TURNSTILE_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: new-frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: new-frontend
        run: npx playwright install --with-deps chromium
      # Playwright builds and starts the backend (on Node) and the frontend preview itself.
      - name: Run the end-to-end suite
        working-directory: new-frontend
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            new-frontend/playwright-report/
            new-frontend/test-results/
          retention-days: 14

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./new-frontend
          push: false
          load: true
          tags: chizzy-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet
      - name: Validate the gateway nginx config
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          -v "$PWD/deploy/nginx:/etc/nginx/chizzy:ro"
          nginxinc/nginx-unprivileged:1.28.2-alpine3.23 nginx -t
      - name: Validate the frontend nginx config (rendered by the image entrypoint)
        run: docker run --rm chizzy-frontend:ci nginx -t
      - name: Check the gateway's real client IP handling
        run: sh scripts/test-gateway-real-ip.sh

  stack:
    name: Compose stack end-to-end
    needs: [docker, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Read by docker compose: the images built below, the browser origin the
      # backend allows, and the API URL baked into the frontend bundle.
      BACKEND_IMAGE: chizzy-backend
      FRONTEND_IMAGE: chizzy-frontend
      IMAGE_TAG: ci
      BACKEND_REPLICAS: "2"
      CORS_ORIGINS: http://localhost:5173
      VITE_API_URL: http://localhost:3004
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same caches as the docker job; loaded into the local daemon for compose.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          load: true
          tags: chizzy-backend:ci
          cache-from: type=gha,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./new-frontend
          load: true
          tags: chizzy-frontend:ci
          build-args: VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha,scope=frontend
      # Redis, two backend replicas, the gateway on :3004 and the frontend on :5173.
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Check health through the gateway and the frontend
        run: |
          curl -fsS http://localhost:3004/healthz
          curl -fsS http://localhost:3004/readyz
          curl -fsS http://localhost:5173/healthz
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: new-frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: new-frontend
        run: npx playwright install --with-deps chromium
      # External mode: no servers are started. The accept-timeout test waits
      # for the stack's real 30 s window.
      - name: Run the end-to-end suite against the stack
        working-directory: new-frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:5173
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-stack
          path: |
            new-frontend/playwright-report/
            new-frontend/test-results/
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down -v
