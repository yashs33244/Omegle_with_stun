name: CI

on:
  pull_request:
  push:
    # new-v runs CI through deploy.yml (workflow_call) before deploying.
    branches-ignore: [new-v]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "22.23.3"
  # Lockfiles generated behind a private package-firewall mirror record its
  # tarball URLs; point them at the public npm registry (integrity unchanged).
  LOCKFILE_REGISTRY_FIX: 's#https://registry\.npmjs\.org/#https://registry.npmjs.org/#g'

jobs:
  protocol:
    name: Protocol in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/sync-protocol.sh --check

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Use the public npm registry in bun.lock
        run: sed -i -E "$LOCKFILE_REGISTRY_FIX" bun.lock
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Test (includes the Redis suites)
        run: bun test
        env:
          REDIS_URL: redis://localhost:6379
      - run: bun run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: new-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: new-frontend/package-lock.json
      - name: Use the public npm registry in package-lock.json
        run: sed -i -E "$LOCKFILE_REGISTRY_FIX" package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./new-frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example config --quiet
      - name: Validate the gateway nginx config
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro"
          nginxinc/nginx-unprivileged:1.28.2-alpine3.23 nginx -t
