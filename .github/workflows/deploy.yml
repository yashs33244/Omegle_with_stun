name: Deploy

# Every secret used here is documented in DEPLOYMENT.md.
on:
  push:
    branches: [new-v]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: yashs3324/omegle-backend
  FRONTEND_IMAGE: yashs3324/omegle-frontend

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./new-frontend
          push: true
          # VITE_API_URL is new; REACT_APP_API_URL is the older secret with the same value.
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL || secrets.REACT_APP_API_URL || 'https://chizzyapi.itsyash.space' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to EC2
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PROJECT_PATH: ${{ secrets.PROJECT_PATH || 'Omegle_with_stun' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The host always runs the compose file and deploy/ from this commit. They
      # land in .incoming/ and deploy.sh installs them (keeping the previous
      # copy for rollback), plus the host scripts for Redis backups.
      - name: Copy compose file, deploy/ and host scripts to the host
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          source: docker-compose.yml,deploy,scripts/backup-redis.sh,scripts/restore-redis.sh
          target: ${{ env.PROJECT_PATH }}/.incoming
          rm: true

      # deploy.sh writes .env (mode 600) from these variables without printing
      # them, pulls the sha-tagged images, runs `docker compose up --wait`,
      # verifies /healthz and /readyz through the gateway and the frontend
      # /healthz, and rolls back to the previous tag if anything fails.
      - name: Deploy, verify and roll back on failure
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_WRITE_ENV: "1"
          DEPLOY_TAG: ${{ github.sha }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || 'https://chizzy.itsyash.space' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BACKEND_REPLICAS: ${{ secrets.BACKEND_REPLICAS }}
          BIND_ADDRESS: ${{ secrets.BIND_ADDRESS }}
          STUN_URLS: ${{ secrets.STUN_URLS }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          TURN_TTL_SECONDS: ${{ secrets.TURN_TTL_SECONDS }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SESSION_SECRET_PREVIOUS: ${{ secrets.SESSION_SECRET_PREVIOUS }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_DISABLED: ${{ secrets.TURNSTILE_DISABLED }}
          TRUST_CLOUDFLARE: ${{ secrets.TRUST_CLOUDFLARE }}
          TURN_PROVIDER: ${{ secrets.TURN_PROVIDER }}
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_DSN_FRONTEND: ${{ secrets.SENTRY_DSN_FRONTEND }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_ALLOWED_IPS: ${{ secrets.ADMIN_ALLOWED_IPS }}
          EVIDENCE_S3_BUCKET: ${{ secrets.EVIDENCE_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CLOUDFLARE_ONLY: ${{ secrets.CLOUDFLARE_ONLY }}
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          command_timeout: 15m
          envs: PROJECT_PATH,BACKEND_IMAGE,FRONTEND_IMAGE,DEPLOY_WRITE_ENV,DEPLOY_TAG,CORS_ORIGINS,REDIS_PASSWORD,BACKEND_REPLICAS,BIND_ADDRESS,STUN_URLS,TURN_URLS,TURN_SECRET,TURN_USERNAME,TURN_CREDENTIAL,TURN_TTL_SECONDS,METRICS_TOKEN,LOG_LEVEL,SESSION_SECRET,SESSION_SECRET_PREVIOUS,TURNSTILE_SECRET,TURNSTILE_SITE_KEY,TURNSTILE_DISABLED,TRUST_CLOUDFLARE,TURN_PROVIDER,CF_TURN_KEY_ID,CF_TURN_API_TOKEN,CF_ACCOUNT_ID,CF_ANALYTICS_TOKEN,SENTRY_DSN,SENTRY_DSN_FRONTEND,POSTHOG_KEY,POSTHOG_HOST,ADMIN_TOKEN,ADMIN_ALLOWED_IPS,EVIDENCE_S3_BUCKET,AWS_REGION,CLOUDFLARE_ONLY,BACKUP_S3_URI
          script: |
            set -eu
            cd "$PROJECT_PATH"
            bash .incoming/deploy/deploy.sh "$DEPLOY_TAG"
