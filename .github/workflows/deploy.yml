name: Deploy to EC2

on:
  push:
    branches: [ new-v ]

env:
  DOCKER_REGISTRY: docker.io
  BACKEND_IMAGE: yashs3324/omegle-backend
  FRONTEND_IMAGE: yashs3324/omegle-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install backend dependencies
      run: |
        cd backend
        bun install

    - name: Build backend
      run: |
        cd backend
        bun run build

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:latest
          ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./new-frontend
        push: true
        build-args: |
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ENVIRONMENT=production
        tags: |
          ${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Set project path with fallback
          PROJECT_PATH="${{ secrets.PROJECT_PATH }}"
          if [ -z "$PROJECT_PATH" ]; then
            PROJECT_PATH="Omegle_with_stun"
          fi
          
          # Navigate to project directory
          echo "Navigating to project directory: $PROJECT_PATH"
          if [ ! -d "$PROJECT_PATH" ]; then
            echo "Project directory $PROJECT_PATH does not exist!"
            exit 1
          fi
          cd "$PROJECT_PATH"
          
          # Verify we're in the right directory
          if [ ! -f "docker-compose.yml" ]; then
            echo "docker-compose.yml not found in current directory: $(pwd)"
            exit 1
          fi
          
          echo "Current directory: $(pwd)"
          echo "Files in directory: $(ls -la)"
          
          # Create .env file with secrets
          cat > .env << EOF
          NODE_ENV=production
          BACKEND_PORT=3004
          FRONTEND_PORT=5173
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          FRONTEND_URL=http://localhost:5173
          EOF
          
          echo "Environment file created:"
          cat .env
          
          # Pull latest images
          echo "Pulling latest images..."
          docker compose pull
          
          # Stop existing containers gracefully
          echo "Stopping existing containers..."
          docker compose down --timeout 30
          
          # Start new containers
          echo "Starting new containers..."
          docker compose up -d
          
          # Wait for services to start
          echo "Waiting for services to start..."
          sleep 15
          
          # Check container status
          echo "Container status:"
          docker compose ps
          
          # Check container logs for any errors
          echo "Recent backend logs:"
          docker compose logs backend --tail=20
          echo "Recent frontend logs:"
          docker compose logs frontend --tail=20
          
          # Clean up old images
          echo "Cleaning up old images..."
          docker system prune -f --volumes
          docker image prune -a -f
          
          # Verify deployment with retries
          echo "Verifying deployment..."
          BACKEND_HEALTHY=false
          FRONTEND_HEALTHY=false
          
          # Check backend health (retry up to 6 times with 10 second intervals)
          for i in {1..6}; do
            echo "Backend health check attempt $i..."
            if curl -f http://localhost:3004/health; then
              echo "Backend is healthy!"
              BACKEND_HEALTHY=true
              break
            fi
            sleep 10
          done
          
          # Check frontend health (retry up to 6 times with 10 second intervals)
          for i in {1..6}; do
            echo "Frontend health check attempt $i..."
            if curl -f http://localhost:5173; then
              echo "Frontend is healthy!"
              FRONTEND_HEALTHY=true
              break
            fi
            sleep 10
          done
          
          # Report final status
          if [ "$BACKEND_HEALTHY" = true ] && [ "$FRONTEND_HEALTHY" = true ]; then
            echo "✅ Deployment successful! Both services are healthy."
          else
            echo "❌ Deployment completed but some services may not be healthy:"
            echo "Backend healthy: $BACKEND_HEALTHY"
            echo "Frontend healthy: $FRONTEND_HEALTHY"
            echo "Container status:"
            docker compose ps
            exit 1
          fi
