name: Deploy to EC2

on:
  push:
    branches: [ new-v ]

env:
  DOCKER_REGISTRY: docker.io
  BACKEND_IMAGE: yashs3324/omegle-backend
  FRONTEND_IMAGE: yashs3324/omegle-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Backend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install backend dependencies
      run: |
        cd backend
        bun install

    - name: Build backend
      run: |
        cd backend
        bun run build

    - name: Test backend
      run: |
        cd backend
        bun test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:latest
          ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./new-frontend
        push: true
        build-args: |
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ENVIRONMENT=production
        tags: |
          ${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ${{ secrets.PROJECT_PATH || 'Omegle_with_stun' }}/
          
          # Create .env file with secrets
          cat > .env << EOF
          NODE_ENV=production
          BACKEND_PORT=3004
          FRONTEND_PORT=3000
          REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          EOF
          
          # Pull latest images
          docker compose pull
          
          # Zero-downtime deployment using docker-rollout
          # Install docker-rollout if not exists
          if ! command -v docker-rollout &> /dev/null; then
            echo "Installing docker-rollout..."
            mkdir -p ~/.docker/cli-plugins
            curl -L https://github.com/wowu/docker-rollout/releases/latest/download/docker-rollout-linux-amd64 -o ~/.docker/cli-plugins/docker-rollout
            chmod +x ~/.docker/cli-plugins/docker-rollout
          fi
          
          # Perform zero-downtime deployment
          docker rollout -f docker-compose.yml backend frontend
          
          # Clean up old images
          docker system prune -f --volumes
          docker image prune -a -f
          
          # Verify deployment
          echo "Verifying deployment..."
          sleep 10
          curl -f http://localhost:3004/health || echo "Backend health check failed"
          curl -f http://localhost:5173/health || echo "Frontend health check failed"
