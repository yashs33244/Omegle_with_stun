version: 2
updates:
  - package-ecosystem: npm
    directory: /new-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /new-frontend
    schedule:
      interval: weekly

  # Pinned images in docker-compose.yml (redis, gateway nginx, coturn).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
